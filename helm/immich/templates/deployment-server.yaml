apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "immich.fullname" . }}-server
  labels:
    {{- include "immich.labels" . | nindent 4 }}
    app: immich-server
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      {{- include "immich.serverLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "immich.serverLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "immich.fullname" . }}
      containers:
        - name: immich-server
          image: "ghcr.io/immich-app/immich-server:{{ .Values.immich.version }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 2283
          envFrom:
            - configMapRef:
                name: {{ include "immich.fullname" . }}-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "immich.fullname" . }}-db
                  key: DB_PASSWORD
          volumeMounts:
            - name: uploads
              mountPath: /data
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ include "immich.fullname" . }}-uploads
        - name: tmp
          emptyDir: {}
        - name: localtime
          hostPath:
            path: /etc/localtime
            type: File
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "immich.fullname" . }}-server
  labels:
    {{- include "immich.labels" . | nindent 4 }}
spec:
  type: {{ .Values.server.service.type }}
  selector:
    {{- include "immich.serverLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: {{ .Values.server.service.port }}
