apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "immich.fullname" . }}-redis
  labels:
    {{- include "immich.labels" . | nindent 4 }}
    app: redis
spec:
  replicas: {{ .Values.redis.replicas }}
  selector:
    matchLabels:
      {{- include "immich.redisLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "immich.redisLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "immich.fullname" . }}
      containers:
        - name: redis
          image: "{{ .Values.redis.image }}:{{ .Values.redis.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: redis-data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "immich.fullname" . }}-redis
  labels:
    {{- include "immich.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "immich.redisLabels" . | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
