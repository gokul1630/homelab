immich:
  version: release

imagePullPolicy: IfNotPresent
server:
  replicas: 1
  service:
    type: ClusterIP
    port: 2283
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

ingress:
  enabled: true
  className: traefik
  host: ""
  annotations: {}
  tls: []

machineLearning:
  replicas: 1
  image:
    repository: ghcr.io/immich-app/immich-machine-learning
  service:
    port: 3003
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 8Gi

redis:
  image: valkey/valkey
  tag: "9"
  replicas: 1

database:
  image: ghcr.io/immich-app/postgres
  tag: 14-vectorchord0.4.3-pgvectors0.2.0
  replicas: 1
  username: 
  databaseName: immich
  password: 
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

storage:
  hostPath:
    enabled: true

  common:
    reclaimPolicy: Retain

  uploads:
    size: 500Gi
    accessModes:
      - ReadWriteOnce
    storageClassName: local-path
    hostPath: /tank/immich

  postgres:
    size: 20Gi
    accessModes:
      - ReadWriteOnce
    storageClassName: local-path
    hostPath: /opt/immich/postgres

  modelCache:
    size: 10Gi
    accessModes:
      - ReadWriteOnce
    storageClassName: local-path
    hostPath: /opt/immich/model-cache

networkPolicy:
  enabled: true
  ingressControllerNamespace: kube-system
